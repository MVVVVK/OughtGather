name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "requirements-dev.txt"

      # epubcheck.jar 需要 Java；缺 Java 时相关测试会被 skip
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run Cloudflare Worker tests
        run: node --test cloudflare-worker/index.test.mjs

      - name: Test public RSS diagnostics offline
        run: python -m pytest -o addopts= scripts/rss_diagnostics/test_rss_probe.py scripts/rss_diagnostics/test_phase3_offline.py scripts/rss_diagnostics/test_public_samples.py scripts/rss_diagnostics/test_event_ledger.py -q

  b3-e5-experiment:
    # Only explicit manual dispatch of the B3 branch; never PR/push CI.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/editorial-b3-hybrid'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HF_HOME: /tmp/b3-hf-${{ github.run_id }}-${{ github.run_attempt }}
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_ENDPOINT: https://huggingface.co
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Initialize safe status
        run: python -c 'import json; open("b3-e5-report.json", "w").write(json.dumps({"status":"failed","failure_stage":"dependencies"}))'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install isolated experiment dependencies
        run: python -m pip install -r requirements-b3-experiment.txt
      - name: Download pinned model and run synthetic inference
        run: python -m scripts.editorial_v2.semantic.ci_experiment
      - name: Upload aggregate-only experiment status
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: b3-e5-aggregate
          path: b3-e5-report.json
          retention-days: 7
          if-no-files-found: warn

  rss-public-diagnostics:
    # Manual only; restricted to the audit branch. No Secrets or production config.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/rss-source-quality-audit'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install diagnostic dependencies
        run: python -m pip install 'feedparser>=6,<7' 'httpx>=0.25,<1' 'pytest>=7,<10' 'beautifulsoup4>=4.12,<5'
      - name: Test diagnostics offline
        run: python -m pytest -o addopts= scripts/rss_diagnostics/test_rss_probe.py scripts/rss_diagnostics/test_phase3_offline.py scripts/rss_diagnostics/test_public_samples.py scripts/rss_diagnostics/test_event_ledger.py -q
      - name: Probe public feeds without credentials
        run: python scripts/rss_diagnostics/rss_probe.py scripts/rss_diagnostics/sources.json rss-diagnostic.json
      - name: Inspect bounded public RSS titles
        run: python scripts/rss_diagnostics/public_samples.py scripts/rss_diagnostics/sources.json
      - name: Upload sanitized diagnostic results
        uses: actions/upload-artifact@v4
        with:
          name: rss-public-diagnostic
          path: rss-diagnostic.json
          retention-days: 7
          if-no-files-found: error
