name: Daily Gather

on:
  schedule:
    - cron: '30 22 * * *'  # 06:30 Asia/Shanghai (UTC+8)
  workflow_dispatch:  # 支持手动触发
    inputs:
      test_mode:
        description: "Reprocess articles with isolated dedup history and no delivery"
        type: boolean
        default: false
      upload_plaintext_epub:
        description: "Explicitly upload a plaintext EPUB artifact (visible to artifact readers)"
        type: boolean
        default: false
      retry_failed:
        description: "Reset failed-article retry counters (published history is retained)"
        type: boolean
        default: false
  repository_dispatch:  # 支持 Cloudflare Workers 等外部触发
    types: [Daily_Gather_cf_triggerd]

concurrency:
  group: oughtgather-dedup
  cancel-in-progress: false

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Cache Playwright browsers
        # Playwright 安装与缓存说明见 docs/PLAYWRIGHT.md。
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install-deps chromium

      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: Enable unprivileged user namespaces for Chromium sandbox
        run: |
          if sudo sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Prepare config.json
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          if [ -n "$CONFIG_JSON" ]; then
            echo "Using CONFIG_JSON from GitHub Secret"
            echo "$CONFIG_JSON" > config.json
          elif [ -f config.json ]; then
            echo "Using config.json from repository"
          else
            echo "::error::No config found. Set CONFIG_JSON secret or commit config.json to the repo."
            exit 1
          fi
          # Validate JSON
          python -c "import json; json.load(open('config.json'))" \
            || { echo "::error::config.json contains invalid JSON. Validate at https://jsonlint.com"; exit 1; }
          echo "✓ config.json is valid"

      - name: Restore dedup records
        if: ${{ !inputs.test_mode }}
        uses: actions/cache/restore@v5
        with:
          path: data/fetched_urls.txt
          key: ${{ runner.os }}-dedup-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-dedup-v2-
            ${{ runner.os }}-dedup-

      - name: Run Ought Gather
        env:
          # 时区设置
          TZ: Asia/Shanghai

          # SMTP 配置（必需）
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_FALLBACK_ATTACHMENT: ${{ secrets.EMAIL_FALLBACK_ATTACHMENT }}
          DELIVERY_BACKUP_KEY: ${{ secrets.DELIVERY_BACKUP_KEY }}

          # WebDAV 配置
          WEBDAV_ENABLED: ${{ secrets.WEBDAV_ENABLED }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
          WEBDAV_REMOTE_PATH: ${{ secrets.WEBDAV_REMOTE_PATH }}
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
          WEBDAV_RETENTION_DAYS: ${{ secrets.WEBDAV_RETENTION_DAYS }}

          # EPUB localization and Bing wallpaper market (optional)
          EPUB_LANGUAGE: ${{ secrets.EPUB_LANGUAGE }}

          # 自动注入 Secrets
          OPENROUTER_API_ENDPOINT: ${{ secrets.OPENROUTER_API_ENDPOINT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          QWEATHER_HOST: ${{ secrets.QWEATHER_HOST }}
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          RAINDROPIO_API_KEY: ${{ secrets.RAINDROPIO_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TESTMAIL_APP_API_KEY: ${{ secrets.TESTMAIL_APP_API_KEY }}

        run: |
          args=()
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            args+=(--test-mode)
          fi
          if [ "${{ inputs.retry_failed }}" = "true" ]; then
            args+=(--retry-failed)
          fi
          python -u src/main.py "${args[@]}"

      - name: Save dedup records
        if: ${{ success() && !inputs.test_mode }}
        uses: actions/cache/save@v5
        with:
          path: data/fetched_urls.txt
          key: ${{ runner.os }}-dedup-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-report
          path: |
            output/quality-report.json
            output/quality-sources.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload encrypted delivery backup
        if: ${{ always() && !inputs.test_mode }}
        uses: actions/upload-artifact@v6
        with:
          name: delivery-retry-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/delivery-retry.enc
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload delivery status
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: delivery-status
          path: output/delivery-status.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload EPUB artifact
        # 明文 EPUB 必须由手动运行者明确开启。
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_plaintext_epub }}
        uses: actions/upload-artifact@v6
        with:
          name: epub-files
          path: output/*.epub
          retention-days: 7

      - name: Upload dedup records
        # 上传去重数据文件（data/fetched_urls.txt），仅在失败或手动触发时执行，便于排查
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: dedup-records
          path: data/fetched_urls.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload logs
        # 仅在失败或手动触发时上传运行日志，节省正常定时运行的 Artifact 开销与时间
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: logs
          path: logs/*.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Check delivery status
        if: ${{ always() && !inputs.test_mode }}
        run: |
          if [ -f output/delivery-status.json ]; then
            python -c "import json,sys; sys.exit(1 if json.load(open('output/delivery-status.json'))['webdav'] == 'failed' else 0)"
          fi
