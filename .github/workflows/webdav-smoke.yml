name: Isolated WebDAV Smoke Test
on:
  workflow_dispatch:
    inputs:
      authorize:
        description: 'Authorize creating and deleting a random test directory at the Jianguoyun DAV root'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  isolated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require explicit authorization
        run: |
          if [ "${{ inputs.authorize }}" != "true" ]; then
            echo "Explicit authorization is required."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install HTTP client
        run: pip install 'httpx>=0.25.0,<1'
      - name: Test isolated collection
        env:
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
        run: python -m src.uploader.webdav_smoke --authorize-isolated
